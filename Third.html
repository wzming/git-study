<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
            font-weight: 300;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.2em;
            line-height: 1.6;
        }
        
        .features {
            display: flex;
            justify-content: space-around;
            margin: 40px 0;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .feature {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            min-width: 150px;
            transition: transform 0.3s ease;
        }
        
        .feature:hover {
            transform: translateY(-5px);
        }
        
        .feature-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 欢迎来到我的页面</h1>
        <p class="subtitle">
            这是一个简单而优雅的网页示例，展示了现代网页设计的基本元素。
            包含了响应式设计、渐变背景和交互效果。
        </p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🎨</div>
                <h3>美观设计</h3>
                <p>现代化的视觉效果</p>
            </div>
            <div class="feature">
                <div class="feature-icon">📱</div>
                <h3>响应式</h3>
                <p>适配各种设备</p>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <h3>快速加载</h3>
                <p>优化的性能表现</p>
            </div>
        </div>
        
        <div>
            <a href="#" class="button" onclick="showMessage()">点击我</a>
            <a href="#" class="button" onclick="changeTheme()">切换主题</a>
        </div>
        
        <div class="footer">
            <p>© 2025 示例页面 | 使用现代Web技术构建</p>
        </div>
    </div>

    <script>
        function showMessage() {
            alert('你好！欢迎访问这个页面！ 🎉');
        }
        
        function changeTheme() {
            const body = document.body;
            if (body.style.background.includes('667eea')) {
                body.style.background = 'linear-gradient(135deg, #ff6b6b 0%, #ffa500 100%)';
            } else {
                body.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
            }
        }
        
        // 添加一些动态效果
        document.addEventListener('DOMContentLoaded', function() {
            const container

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Four 页面</title>
  <style>
    :root {
      --bg: #0f172a;      /* slate-900 */
      --panel: #111827;   /* gray-900 */
      --text: #e5e7eb;    /* gray-200 */
      --muted: #9ca3af;   /* gray-400 */
      --accent: #22c55e;  /* green-500 */
      --accent-2: #60a5fa;/* blue-400 */
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: radial-gradient(1200px 800px at 10% 10%, rgba(96,165,250,.15), transparent 50%),
                  radial-gradient(800px 600px at 90% 20%, rgba(34,197,94,.12), transparent 40%),
                  var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(920px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      overflow: hidden;
    }
    header {
      padding: 24px 28px;
      background: linear-gradient(90deg, rgba(34,197,94,.12), rgba(96,165,250,.12));
      border-bottom: 1px solid rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header .logo {
      width: 40px; height: 40px; border-radius: 10px;
      background: conic-gradient(from 210deg, var(--accent), var(--accent-2));
      box-shadow: inset 0 0 18px rgba(255,255,255,.2);
    }
    header h1 { margin: 0; font-size: 20px; letter-spacing: .4px; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

    nav {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: rgba(17,24,39,.6);
      border-bottom: 1px solid rgba(255,255,255,.06);
      flex-wrap: wrap;
    }
    nav a {
      color: var(--text);
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.08);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 14px;
      transition: all .2s ease;
      background: rgba(255,255,255,.02);
    }
    nav a:hover { border-color: rgba(34,197,94,.6); transform: translateY(-1px); }

    main { padding: 26px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 24px; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

    .panel {
      background: rgba(17,24,39,.6);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 14px;
      padding: 18px;
    }
    .panel h2 { margin: 0 0 10px; font-size: 18px; }
    .panel p { margin: 8px 0; color: var(--muted); line-height: 1.6; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: 10px; cursor: pointer;
      color: #0b1220; background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border: none; font-weight: 600;
      box-shadow: 0 6px 14px rgba(34,197,94,.25), 0 4px 12px rgba(96,165,250,.18);
      transition: transform .15s ease, box-shadow .2s ease;
    }
    .btn:hover { transform: translateY(-1px); }

    footer {
      padding: 18px 24px;
      border-top: 1px solid rgba(255,255,255,.06);
      color: var(--muted);
      background: rgba(17,24,39,.6);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    .clock { font-variant-numeric: tabular-nums; letter-spacing: .3px; }
    .tips { font-size: 13px; }
    code.inline { background: rgba(255,255,255,.06); padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1>随便写个页面 · Four.html</h1>
        <p>这是一个简单的演示页面，包含少量样式与交互。</p>
      </div>
    </header>

    <nav>
      <a href="./First.html">First.html</a>
      <a href="./Second.html">Second.html</a>
      <a href="./Third.html">Third.html</a>
      <a href="./README.md">README.md</a>
      <a href="#" onclick="history.back(); return false;">返回</a>
    </nav>

    <main>
      <section class="panel">
        <h2>关于本页</h2>
        <p>页面采用原生 HTML + CSS 实现，无任何构建与依赖，适合在浏览器中直接打开。</p>
        <p>如果你在本仓库中浏览，还可以通过上方导航跳转到其它示例页面。</p>
        <p>你也可以修改此文件 <code class="inline">Four.html</code> 来尝试自己的想法。</p>
        <button class="btn" id="helloBtn" type="button">👋 打个招呼</button>
      </section>

      <aside class="panel">
        <h2>现在时间</h2>
        <p class="clock" id="clock">--:--:--</p>
        <p class="tips">时间为您本地浏览器时间，仅作演示。</p>
      </aside>
    </main>

    <footer>
      <span>© 2025 Simple Demo Page</span>
      <span class="tips">提示：可以直接编辑本文件并刷新查看效果。</span>
    </footer>
  </div>

  <script>
    // 简单时钟
    function pad(n){ return n.toString().padStart(2,'0'); }
    function tick(){
      const d = new Date();
      const s = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ` +
                `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      const el = document.getElementById('clock');
      if (el) el.textContent = s;
    }
    tick();
    setInterval(tick, 1000);

    // 按钮交互
    const btn = document.getElementById('helloBtn');
    if (btn) {
      btn.addEventListener('click', () => {
        alert('你好！欢迎来到 Four.html 😊');
      });
    }
  </script>
</body>
</html>
